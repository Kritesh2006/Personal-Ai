<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIA — Autonomous Reasoning & Intelligence Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- BOOT SCREEN -->
  <div id="boot-screen">
    <div class="boot-logo">
      <svg viewBox="0 0 120 120" class="boot-hex-svg">
        <polygon points="60,4 112,32 112,88 60,116 8,88 8,32" fill="none" stroke="#c0392b" stroke-width="2.5"/>
        <polygon points="60,14 102,38 102,82 60,106 18,82 18,38" fill="none" stroke="#c0392b" stroke-width="1" opacity="0.4"/>
        <text x="60" y="68" text-anchor="middle" font-family="Orbitron" font-weight="900" font-size="26" fill="#c0392b" letter-spacing="2">A</text>
      </svg>
      <div class="boot-name">ARIA</div>
      <div class="boot-tagline">Autonomous Reasoning &amp; Intelligence Assistant</div>
      <div class="boot-progress-bar"><div id="boot-bar"></div></div>
      <div id="boot-status" class="boot-status">Initializing core systems…</div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="hidden">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <svg viewBox="0 0 60 60" class="topbar-hex">
          <polygon points="30,2 56,16 56,44 30,58 4,44 4,16" fill="none" stroke="#c0392b" stroke-width="2"/>
          <text x="30" y="38" text-anchor="middle" font-family="Orbitron" font-weight="900" font-size="16" fill="#c0392b">A</text>
        </svg>
        <div>
          <div class="topbar-title">ARIA</div>
          <div class="topbar-sub">Debate Engine + Automation Core</div>
        </div>
      </div>
      <div class="topbar-right">
        <div id="status-dot" class="status-dot active"></div>
        <span id="status-label" class="status-label">ONLINE</span>
        <button class="icon-btn" id="voice-settings-btn" title="Voice Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
          </svg>
        </button>
        <button class="icon-btn" id="clear-btn" title="Clear Chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- CHAT FEED -->
    <main class="chat-area" id="chat-area">
      <div id="messages" class="messages"></div>
    </main>

    <!-- BOTTOM INPUT BAR -->
    <footer class="input-bar">
      <button id="mic-btn" class="mic-btn" title="Voice Input">
        <svg id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="mic-svg">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M19 10a7 7 0 01-14 0"/>
          <line x1="12" y1="17" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
        <span class="mic-ring"></span>
      </button>
      <input
        id="user-input"
        type="text"
        placeholder="Ask ARIA something, or give a command…"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="send-btn" class="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </footer>

  </div><!-- /#app -->

  <!-- VOICE SETTINGS MODAL -->
  <div id="voice-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <span>Voice Settings</span>
        <button id="modal-close" class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="setting-label">Voice</label>
        <select id="voice-select" class="setting-select"></select>

        <label class="setting-label">Speed <span id="rate-val">1.00</span></label>
        <input type="range" id="rate-slider" min="0.7" max="1.4" step="0.05" value="1.0" class="setting-range" />

        <label class="setting-label">Pitch <span id="pitch-val">0.90</span></label>
        <input type="range" id="pitch-slider" min="0.5" max="1.3" step="0.05" value="0.9" class="setting-range" />

        <label class="setting-label">Voice Output</label>
        <div class="toggle-row">
          <label class="toggle-switch">
            <input type="checkbox" id="voice-output-toggle" checked />
            <span class="slider-knob"></span>
          </label>
          <span class="toggle-hint">Speak ARIA responses aloud</span>
        </div>

        <button id="test-voice-btn" class="test-btn">▶ Test Voice</button>
      </div>
    </div>
  </div>

  <!-- DEBATE RESULT TEMPLATE (JS will clone this) -->
  <template id="debate-template">
    <div class="debate-card">
      <div class="debate-agents">
        <div class="agent-block" data-agent="strategist">
          <div class="agent-label">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1L10 6H15L11 9.5L12.5 15L8 12L3.5 15L5 9.5L1 6H6Z"/></svg>
            Strategist
          </div>
          <div class="agent-content"></div>
        </div>
        <div class="agent-block" data-agent="critic">
          <div class="agent-label">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><line x1="8" y1="5" x2="8" y2="9"/><circle cx="8" cy="11.5" r="0.7" fill="currentColor"/></svg>
            Critic
          </div>
          <div class="agent-content"></div>
        </div>
        <div class="agent-block" data-agent="realist">
          <div class="agent-label">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1"/><line x1="5" y1="7" x2="11" y2="7"/><line x1="5" y1="10" x2="9" y2="10"/></svg>
            Realist
          </div>
          <div class="agent-content"></div>
        </div>
      </div>
      <div class="judge-block">
        <div class="judge-label">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="8,1 10.5,6 16,6.5 12,10.5 13,16 8,13 3,16 4,10.5 0,6.5 5.5,6"/></svg>
          Final Verdict — Judge
        </div>
        <div class="judge-content"></div>
      </div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
